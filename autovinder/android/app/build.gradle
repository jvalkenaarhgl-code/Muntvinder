plugins { id 'com.android.application' }
android {
  namespace 'nl.autovinder.app'
  compileSdk 35
  buildFeatures { buildConfig true }
  defaultConfig {
    applicationId 'nl.autovinder.app'
    minSdk 26
    targetSdk 35
    versionCode 3
    versionName '1.2'
    def feed = (project.findProperty('AUTOVINDER_FEED_URL') ?: '').toString()
    if (feed && !(feed ==~ /https:\/\/[a-zA-Z0-9._\/-]+/)) {
      throw new GradleException('Ongeldige HTTPS-feed')
    }
    buildConfigField 'String', 'DEFAULT_FEED_URL', '"' + feed + '"'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
