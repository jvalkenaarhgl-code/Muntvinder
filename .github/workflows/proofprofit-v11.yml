name: Proofset Rendement 1.1 - APK reparatie
on:
  push:
    branches: [proofset-rendement-v1-20261106]
    paths:
      - '.github/workflows/proofprofit-v11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pak broncode uit
        run: unzip -oq proofprofit-src.zip -d .
      - name: Herstel opslaan en optionele verkoopprijs
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/proofprofit-hotfix.js
          node /tmp/proofprofit-hotfix.js
          node --check proofprofit/app/src/main/assets/app.js
          node proofprofit/tests/finance.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bouw Android APK
        run: gradle -p proofprofit --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Proofset-Rendement-v1.1-APK
          path: proofprofit/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
