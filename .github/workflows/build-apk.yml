name: Bouw Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compileer app met ingebouwde feed-URL
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          FEED_URL="https://${OWNER,,}.github.io/${REPO,,}/feed.json"
          echo "Gebruikte feed: ${FEED_URL}"
          gradle -p android --no-daemon "-PMUNTVINDER_FEED_URL=${FEED_URL}" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Muntvinder-v2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
