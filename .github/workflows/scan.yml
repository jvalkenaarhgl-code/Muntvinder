name: Zoek Nederlandse proofsets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scan.yml'
      - 'scan/**'
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: muntvinder-feed
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer scan-afhankelijkheden
        run: pip install -r scan/requirements.txt pytest
      - name: Controleer de prijzen en advertentiefilters
        run: python -m pytest scan/tests -q
      - name: Scan Marktplaats en Catawiki
        env:
          REEF_API_KEY: ${{ secrets.REEF_API_KEY }}
          CW_SHIPPING_ESTIMATE: '12'
          MP_SHIPPING_ESTIMATE: '0'
        run: python scan/scanner.py
      - name: Publiceer feed rechtstreeks in GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.json docs/shop_prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update automatische Muntvinder zoekresultaten"
            # Neem broncodewijzigingen mee die tijdens de scan zijn gepusht.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
