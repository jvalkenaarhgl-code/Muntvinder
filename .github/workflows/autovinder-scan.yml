name: AutoVinder - scan goedkope occasions
on:
  workflow_dispatch:
  push:
    paths:
      - 'autovinder/scan/**'
      - '.github/workflows/autovinder-scan.yml'
  schedule:
    - cron: '13 * * * *'

permissions:
  contents: write

concurrency:
  group: autovinder-feed
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer vereisten
        run: pip install -r autovinder/scan/requirements.txt
      - name: Test inkoop- en taxatiemodel
        run: pytest -q autovinder/scan/tests
      - name: Gratis openbare Facebook-vondsten en Marktplaats scannen
        run: python autovinder/scan/scanner.py
        env:
          AUTOVINDER_MAX_SCAN_PRICE: '5000'
          AUTOVINDER_MAX_COMPARABLE_PRICE: '12500'

      - name: Publiceer autodeals in AutoVinder-feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp autovinder/docs/feed.json /tmp/autovinder-latest-feed.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B autovinder-publish origin/main
            cp /tmp/autovinder-latest-feed.json autovinder/docs/feed.json
            git add autovinder/docs/feed.json
            if git diff --cached --quiet; then
              echo "De feed was al bijgewerkt."
              exit 0
            fi
            git commit -m "Update AutoVinder tweedehands auto aanbiedingen"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
